<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Articulated Dragon</title>
<style>
  :root { --bg:#0f1115; --panel:#181b22; --text:#e8e6e3; --muted:#9aa0a6; --accent:#e4572e; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; background:var(--bg); color:var(--text); height:100vh; display:flex; flex-direction:column; }
  header { padding:14px 20px; display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; background:var(--panel); border-bottom:1px solid #262a33; }
  h1 { font-size:1.1rem; font-weight:600; letter-spacing:.02em; }
  h1 span { color:var(--accent); }
  .controls { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  select, button, input[type=color] { background:#232733; color:var(--text); border:1px solid #333846; border-radius:6px; padding:6px 10px; font-size:.85rem; cursor:pointer; }
  input[type=color] { padding:2px; width:36px; height:30px; }
  button:hover, select:hover { border-color:var(--accent); }
  a { color:var(--accent); text-decoration:none; font-size:.85rem; }
  #viewer { flex:1; position:relative; }
  #msg { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; color:var(--muted); text-align:center; padding:20px; pointer-events:none; }
  footer { padding:8px 20px; font-size:.75rem; color:var(--muted); background:var(--panel); border-top:1px solid #262a33; }
</style>
</head>
<body>
<header>
  <h1>Articulated <span>Dragon</span></h1>
  <div class="controls">
    <select id="part" aria-label="Choose model part"></select>
    <input type="color" id="color" value="#e4572e" aria-label="Model color">
    <button id="spin">Pause spin</button>
    <button id="wire">Wireframe</button>
    <a href="https://github.com/claire-yuan-xi/articulated-dragon">GitHub</a>
  </div>
</header>
<div id="viewer"><div id="msg">Loading…</div></div>
<footer>Drag to rotate · Scroll to zoom · Right-drag to pan</footer>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { STLLoader } from 'three/addons/loaders/STLLoader.js';
import { OBJLoader } from 'three/addons/loaders/OBJLoader.js';

// List every model file you put in /models here.
const MODELS = [
  { label: 'Full dragon (print-in-place)', file: 'models/dragon.stl' },
  // { label: 'Head', file: 'models/head.stl' },
  // { label: 'Body segment', file: 'models/segment.stl' },
];

const el = document.getElementById('viewer');
const msg = document.getElementById('msg');
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0f1115);

const camera = new THREE.PerspectiveCamera(45, el.clientWidth / el.clientHeight, 0.1, 5000);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(window.devicePixelRatio);
renderer.setSize(el.clientWidth, el.clientHeight);
el.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xffffff, 0x333344, 1.2));
const key = new THREE.DirectionalLight(0xffffff, 1.6); key.position.set(1, 2, 1.5); scene.add(key);
const rim = new THREE.DirectionalLight(0xffb38a, 0.6); rim.position.set(-2, 1, -1); scene.add(rim);

const grid = new THREE.GridHelper(400, 40, 0x333846, 0x222631);
scene.add(grid);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.autoRotate = true;
controls.autoRotateSpeed = 1.5;

const material = new THREE.MeshStandardMaterial({ color: 0xe4572e, roughness: 0.55, metalness: 0.1 });
let current = null;

function frame(obj) {
  const box = new THREE.Box3().setFromObject(obj);
  const size = box.getSize(new THREE.Vector3());
  const center = box.getCenter(new THREE.Vector3());
  obj.position.sub(center);                 // center on origin
  obj.position.y += size.y / 2;             // sit on the grid
  const radius = size.length() / 2;
  camera.position.set(radius * 1.6, radius * 1.2, radius * 1.6);
  controls.target.set(0, size.y / 2, 0);
  grid.scale.setScalar(Math.max(1, radius / 100));
  controls.update();
}

function load(file) {
  msg.style.display = 'flex'; msg.textContent = 'Loading…';
  if (current) { scene.remove(current); current = null; }
  const isObj = file.toLowerCase().endsWith('.obj');
  const loader = isObj ? new OBJLoader() : new STLLoader();
  loader.load(file, (result) => {
    let obj;
    if (isObj) {
      obj = result;
      obj.traverse(c => { if (c.isMesh) c.material = material; });
    } else {
      result.computeVertexNormals();
      obj = new THREE.Mesh(result, material);
    }
    obj.rotation.x = -Math.PI / 2;           // Tinkercad exports Z-up; three.js is Y-up
    const wrap = new THREE.Group(); wrap.add(obj);
    scene.add(wrap); current = wrap;
    frame(wrap);
    msg.style.display = 'none';
  }, undefined, () => {
    msg.textContent = `Couldn't load the model.`;
  });
}

const select = document.getElementById('part');
MODELS.forEach((m, i) => select.add(new Option(m.label, i)));
select.onchange = () => load(MODELS[select.value].file);
if (MODELS.length < 2) select.style.display = 'none';

document.getElementById('color').oninput = e => material.color.set(e.target.value);
document.getElementById('wire').onclick = () => { material.wireframe = !material.wireframe; };
document.getElementById('spin').onclick = e => {
  controls.autoRotate = !controls.autoRotate;
  e.target.textContent = controls.autoRotate ? 'Pause spin' : 'Spin';
};

addEventListener('resize', () => {
  camera.aspect = el.clientWidth / el.clientHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(el.clientWidth, el.clientHeight);
});

renderer.setAnimationLoop(() => { controls.update(); renderer.render(scene, camera); });
load(MODELS[0].file);
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Articulated Dragon</title>
<style>
  :root { --bg:#0f1115; --panel:#181b22; --text:#e8e6e3; --muted:#9aa0a6; --accent:#c1121f; --accent-hover:#e01e2b; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; background:var(--bg); color:var(--text); height:100vh; display:flex; flex-direction:column; }
  header { padding:14px 20px; display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; background:var(--panel); border-bottom:2px solid var(--accent); }
  h1 { font-size:1.1rem; font-weight:700; letter-spacing:.04em; text-transform:uppercase; }
  h1 span { color:var(--accent); }
  .controls { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  button, input[type=color] { background:#232733; color:var(--text); border:1px solid #333846; border-radius:6px; padding:6px 10px; font-size:.85rem; cursor:pointer; }
  input[type=color] { padding:2px; width:36px; height:30px; }
  button:hover { border-color:var(--accent); }
  button.primary { background:var(--accent); border-color:var(--accent); color:#fff; font-weight:600; }
  button.primary:hover { background:var(--accent-hover); border-color:var(--accent-hover); }
  button:disabled { opacity:.5; cursor:not-allowed; }
  a { color:var(--accent); text-decoration:none; font-size:.85rem; font-weight:600; }
  a:hover { color:var(--accent-hover); }
  #viewer { flex:1; position:relative; }
  #msg { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; color:var(--muted); text-align:center; padding:20px; pointer-events:none; }
  footer { padding:10px 20px; font-size:.75rem; font-weight:600; letter-spacing:.08em; text-transform:uppercase; color:var(--text); background:var(--panel); border-top:1px solid #262a33; text-align:center; }
  footer .sep { color:var(--accent); margin:0 .9em; }
  #modal { position:fixed; inset:0; background:rgba(0,0,0,.6); display:none; align-items:center; justify-content:center; padding:20px; z-index:10; }
  #modal.open { display:flex; }
  .card { background:var(--panel); border:1px solid #333846; border-top:3px solid var(--accent); border-radius:10px; padding:22px; max-width:420px; width:100%; }
  .card h2 { font-size:1rem; text-transform:uppercase; letter-spacing:.06em; margin-bottom:10px; }
  .card p { font-size:.9rem; color:var(--muted); line-height:1.5; margin-bottom:10px; }
  .swatch { display:inline-block; width:14px; height:14px; border-radius:3px; vertical-align:-2px; margin-right:6px; border:1px solid #555; }
  .card .row { display:flex; gap:8px; justify-content:flex-end; margin-top:16px; flex-wrap:wrap; }
</style>
</head>
<body>
<header>
  <h1>Articulated <span>Dragon</span></h1>
  <div class="controls">
    <input type="color" id="color" value="#c1121f" aria-label="Model color">
    <button id="spin">Pause spin</button>
    <button id="wire">Wireframe</button>
    <button id="export" class="primary" disabled>Export STL</button>
    <a href="https://github.com/claire-yuan-xi/articulated-dragon">GitHub</a>
  </div>
</header>
<div id="viewer"><div id="msg">Loading…</div></div>
<footer>
  Drag to Rotate<span class="sep">|</span>Scroll to Zoom<span class="sep">|</span>Right-Drag to Pan<span class="sep">|</span>Export to Request a Print
</footer>

<div id="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
  <div class="card">
    <h2 id="modal-title">STL Exported</h2>
    <p><span class="swatch" id="swatch"></span><strong id="filename"></strong> has been downloaded.</p>
    <p>Want this dragon printed? Email the creator. The email will be filled in with your chosen color. Attach the downloaded file before you send it.</p>
    <div class="row">
      <button id="close">Close</button>
      <button id="email" class="primary">Email Creator</button>
    </div>
  </div>
</div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { STLLoader } from 'three/addons/loaders/STLLoader.js';

const MODEL_FILE = 'models/dragon.stl';
const CREATOR_EMAIL = 'claire.yuan02@gmail.com';

const el = document.getElementById('viewer');
const msg = document.getElementById('msg');
const colorInput = document.getElementById('color');
const exportBtn = document.getElementById('export');

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0f1115);

const camera = new THREE.PerspectiveCamera(45, el.clientWidth / el.clientHeight, 0.1, 5000);
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(window.devicePixelRatio);
renderer.setSize(el.clientWidth, el.clientHeight);
el.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xffffff, 0x444455, 1.7));
const key = new THREE.DirectionalLight(0xffffff, 2.2); key.position.set(1, 2, 1.5); scene.add(key);
const rim = new THREE.DirectionalLight(0xffd0d0, 0.6); rim.position.set(-2, 1, -1); scene.add(rim);

const grid = new THREE.GridHelper(400, 40, 0x333846, 0x222631);
scene.add(grid);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.autoRotate = true;
controls.autoRotateSpeed = 1.5;

const material = new THREE.MeshStandardMaterial({ color: colorInput.value, roughness: 0.55, metalness: 0.1 });
let geometry = null;

function frame(obj) {
  const box = new THREE.Box3().setFromObject(obj);
  const size = box.getSize(new THREE.Vector3());
  const center = box.getCenter(new THREE.Vector3());
  obj.position.sub(center);                 // center on origin
  obj.position.y += size.y / 2;             // sit on the grid
  const radius = size.length() / 2;
  camera.position.set(radius * 1.6, radius * 1.2, radius * 1.6);
  controls.target.set(0, size.y / 2, 0);
  grid.scale.setScalar(Math.max(1, radius / 100));
  controls.update();
}

new STLLoader().load(MODEL_FILE, (geo) => {
  geometry = geo;
  geo.computeVertexNormals();
  const mesh = new THREE.Mesh(geo, material);
  mesh.rotation.x = -Math.PI / 2;           // Tinkercad exports Z-up; three.js is Y-up
  const wrap = new THREE.Group(); wrap.add(mesh);
  scene.add(wrap);
  frame(wrap);
  msg.style.display = 'none';
  exportBtn.disabled = false;
}, undefined, () => {
  msg.textContent = "Couldn't load the model.";
});

// ---- Colored STL export ----
// Standard STL has no color, so the chosen color is stored two common ways:
//  1. The 80-byte header starts with "COLOR=" + RGBA (Materialise Magics convention).
//  2. Each triangle's attribute bytes hold a 15-bit RGB color with bit 15 set
//     (VisCAM/SolidView convention). In Magics, bit 15 means "use the header color",
//     so both readers end up with the same color.
// The color hex code is also put in the file name and the email.
function buildColoredSTL(geo, hex) {
  const n = parseInt(hex.slice(1), 16);     // read sRGB straight from the hex code
  const r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  const pos = geo.getAttribute('position');
  const index = geo.getIndex();
  const triCount = index ? index.count / 3 : pos.count / 3;

  const buffer = new ArrayBuffer(84 + triCount * 50);
  const view = new DataView(buffer);
  const header = `COLOR=????  Articulated Dragon by Claire Yuan  color ${hex}`;
  for (let i = 0; i < 80; i++) view.setUint8(i, i < header.length ? header.charCodeAt(i) : 0x20);
  view.setUint8(6, r); view.setUint8(7, g); view.setUint8(8, b); view.setUint8(9, 255);
  view.setUint32(80, triCount, true);

  const attr = 0x8000 | ((r >> 3) << 10) | ((g >> 3) << 5) | (b >> 3);
  const va = new THREE.Vector3(), vb = new THREE.Vector3(), vc = new THREE.Vector3();
  const e1 = new THREE.Vector3(), e2 = new THREE.Vector3();
  let o = 84;
  for (let t = 0; t < triCount; t++) {
    const ia = index ? index.getX(3 * t) : 3 * t;
    const ib = index ? index.getX(3 * t + 1) : 3 * t + 1;
    const ic = index ? index.getX(3 * t + 2) : 3 * t + 2;
    va.fromBufferAttribute(pos, ia); vb.fromBufferAttribute(pos, ib); vc.fromBufferAttribute(pos, ic);
    e1.subVectors(vb, va); e2.subVectors(vc, va); e1.cross(e2).normalize();
    for (const v of [e1, va, vb, vc]) {
      view.setFloat32(o, v.x, true); view.setFloat32(o + 4, v.y, true); view.setFloat32(o + 8, v.z, true);
      o += 12;
    }
    view.setUint16(o, attr, true); o += 2;
  }
  return buffer;
}

let lastExport = null;

exportBtn.onclick = () => {
  if (!geometry) return;
  const hex = colorInput.value.toLowerCase();
  const filename = `articulated-dragon-${hex.slice(1)}.stl`;
  const blob = new Blob([buildColoredSTL(geometry, hex)], { type: 'model/stl' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 10000);

  lastExport = { hex, filename };
  document.getElementById('filename').textContent = filename;
  document.getElementById('swatch').style.background = hex;
  document.getElementById('modal').classList.add('open');
};

document.getElementById('email').onclick = () => {
  if (!lastExport) return;
  const { hex, filename } = lastExport;
  const subject = `Articulated Dragon print request (${hex.toUpperCase()})`;
  const body =
`Hi Claire,

I'd like an Articulated Dragon printed in this color: ${hex.toUpperCase()}

I've attached the exported file: ${filename}

Name:
Shipping or pickup details:

Thanks!`;
  window.location.href = `mailto:${CREATOR_EMAIL}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
};

const modal = document.getElementById('modal');
document.getElementById('close').onclick = () => modal.classList.remove('open');
modal.onclick = (e) => { if (e.target === modal) modal.classList.remove('open'); };
addEventListener('keydown', (e) => { if (e.key === 'Escape') modal.classList.remove('open'); });

colorInput.oninput = e => material.color.set(e.target.value);
document.getElementById('wire').onclick = () => { material.wireframe = !material.wireframe; };
document.getElementById('spin').onclick = e => {
  controls.autoRotate = !controls.autoRotate;
  e.target.textContent = controls.autoRotate ? 'Pause spin' : 'Spin';
};

addEventListener('resize', () => {
  camera.aspect = el.clientWidth / el.clientHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(el.clientWidth, el.clientHeight);
});

renderer.setAnimationLoop(() => { controls.update(); renderer.render(scene, camera); });
</script>
</body>
</html>
